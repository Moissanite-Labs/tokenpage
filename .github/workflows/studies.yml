name: studies

# Rerun every study and fail if its committed results drift.
# See scripts/check_studies.sh.

on:
  pull_request:
    paths:
      - "studies/**"
      - "scripts/check_studies.sh"
      - ".github/workflows/studies.yml"
  push:
    branches: [main]
    paths:
      - "studies/**"
      - "scripts/check_studies.sh"
      - ".github/workflows/studies.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tokenizer files only. Studies pin them by revision and hash, so a
      # stale cache cannot change results.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ${{ runner.temp }}/tiktoken
          key: tokenizers-${{ hashFiles('studies/*/measure.py') }}
          restore-keys: tokenizers-
      - run: scripts/check_studies.sh
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
